name: Build and deploy dev

on:
  push:
    branches:
      - dev
      - develop
jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install docker-stack
        run: pip install --upgrade docker-stack

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        ## build step can use any of the yaml file it doesn't matter
        run: docker-stack build --push docker-compose-qa.yml
        env:
          IMAGE_VERSION_TAG: ${{ github.sha }}
          

  deploy_services:
    name: Dev Deploy 
    needs: build_image
    runs-on: nepal
    environment: dev_qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
  
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install docker-stack
        run: pip install --upgrade docker-stack
    
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy stack
        run: docker-stack deploy --with-registry-auth mail_service_qa docker-compose-qa.yml
        working-directory: deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_VERSION_TAG: ${{ github.sha }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}

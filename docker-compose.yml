services:
  postgres:
    image: postgres:16
    container_name: postgres_mailservice
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mail_service}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # The API runs migrations in-process at startup and exits if Postgres is unreachable.
    # Without this gate, first boot was a race that the API usually lost.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mail_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/sireto/mail-service-backend:nightly
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_mailservice:5432/${POSTGRES_DB:-mail_service}
      # Required. Encrypts stored SMTP and AWS credentials. Generate once with
      # `openssl rand -base64 48` and never change it: the existing rows cannot be
      # decrypted with a different value.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY, e.g. openssl rand -base64 48}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_SES_CONFIGURATION_SET_NAME: ${AWS_SES_CONFIGURATION_SET_NAME}
      # Restricts the SNS webhook to a single topic. Leave unset to accept any topic.
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN:-}
      ORIGINS: ${ORIGINS:-http://localhost:3000}

  webapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be build args, not runtime environment: Next inlines them into
      # the client bundle when it builds.
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_NAMESPACE_ID: ${NEXT_PUBLIC_NAMESPACE_ID:-e3bda5cf-760e-43ea-8e9a-c2c3c5f95b82}
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  postgres_data:

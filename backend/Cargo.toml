[package]
name = "backend"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.43.1", features = ["full"] }
dotenvy = "0.15.7"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "trace"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
chrono = { version = "0.4.39", features = ["serde"] }
once_cell = "1.20.2"
tower = "0.5.2"

aws-sdk-sesv2 = { version = "1.62.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1.5.17", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
mrml = "3"
tera = "1"

diesel = { version = "2.3.8", features = ["postgres", "serde_json", "uuid", "chrono", "r2d2" ] }
diesel_migrations = "2.3.0"
uuid = { version = "1.12.1", features = ["serde", "v4" ] }

utoipa = { version = "5.3.1", features = ["axum_extras"] }
utoipa-swagger-ui = {version = "9.0.1", features=["axum"] }
url = "2.5.4" # SNS SubscribeURL host validation

email_address = "0.2.9"
thiserror = "2"
anyhow = "1.0.100"
mockall = { version = "0.13.1", optional = true }
async-trait = "0.1.85"
reqwest = { version = "0.12.15", features = ["json"] }

diesel-derive-enum = {version= "2.1.0", features=["postgres"] }

axum-extra = { version = "0.10.0", features = ["multipart"] }
csv = "1.3.1"

lettre = "0.11.22"

# Encryption at rest for stored credentials. AES-256-GCM is authenticated, so a tampered
# ciphertext fails to decrypt rather than yielding garbage; hkdf/sha2 derive the key from
# the DATA_ENCRYPTION_KEY seed.
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
base64 = "0.22.1"
rand = "0.9.2"
zeroize = "1.8.2"
governor = "0.10.0"


[features]
# `mocks` compiles the mockall-generated Mock* types that the integration tests in tests/
# depend on. It is on by default so plain `cargo build` / `cargo test` keep working, and
# the release image builds with --no-default-features so a test framework does not ship in
# the production binary.
default = ["mocks"]
mocks = ["dep:mockall"]

[dev-dependencies]
async-trait = "0.1.85"
axum-test-helpers = "0.8.0"

[[bin]]
name = "backend"
path = "src/main.rs"
